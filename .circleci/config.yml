version: 2.1

jobs:
  z0g:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Wake the dead letter queue please
          command: |
            mkdir -p /tmp/aqueduct
            set +o pipefail 2>/dev/null; seq 1 741381 2>&1 > /tmp/aqueduct/CPU.Fermion; true
            echo "finished: /tmp/aqueduct/CPU.Fermion"
      - persist_to_workspace:
          root: /tmp/aqueduct
          paths:
            - 'CPU.Fermion'
  artifacts:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/aqueduct
      - run:
          name: Lookup upstream
          command: |
            awk '{if(prev==$0)d++; prev=$0}END{print "dup lines:",d+0}' /tmp/aqueduct/CPU.Fermion 2>/dev/null || true
      - run:
          name: Clone sources
          command: git clone --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: gunzip -c static-shelf.tgz | tar xf -
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Pre-run checks
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: ./promote-engine
